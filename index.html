<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Find Your Color</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="card" id="app">
      <section id="start" class="screen">
        <h1>Find Your Color</h1>
        <p class="sub">Answer 3 quick questions to find out which team you're on.</p>
        <button class="primary" id="startBtn">Start</button>
      </section>

      <section id="quiz" class="screen hidden">
        <div class="progress"><div class="bar" id="bar"></div></div>
        <p class="step" id="step"></p>
        <h2 id="question"></h2>
        <div class="answers" id="answers"></div>
        <button class="link" id="backBtn">&larr; Back</button>
      </section>

      <section id="result" class="screen hidden">
        <div class="swatch" id="swatch"></div>
        <p class="sub">Your team</p>
        <h2 id="teamName"></h2>
        <p id="teamMessage" class="sub"></p>
        <button class="primary" id="restartBtn">Start over</button>
      </section>
    </main>

    <script src="config.js"></script>
    <script src="app.js"></script>
  </body>
</html>
